  <img routerLink="/qr" style="display: block; margin-left: auto; margin-right: auto; width: 50%;"
    src="https://storage.googleapis.com/sukkeregernimages/egern.svg" alt="Sukker egernet">
  <br>
  <b style="text-align: center; margin-bottom: 5px; font-size: 100%">Mobilepay: 9213EU</b>

@defer {
<stregliste class="fade-in"></stregliste>
} @placeholder {
<div class="fade-out" style="display:flex; flex-direction:column; justify-content:center; margin-bottom:5px;">
  <img alt="loading..." style="display: block; margin-left: auto; margin-right: auto; width: 25%;"
    src="https://storage.googleapis.com/sukkeregernimages/Loading_icon.gif" />
</div>
} @loading {

    src="https://storage.googleapis.com/sukkeregernimages/Loading_icon.gif" />
</div>
}
